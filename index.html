<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Socket Scrubber Inverted</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script>
      AFRAME.registerComponent('socket-scrub', {
        init: function () {
          this.camera = this.el;
          this.connected = false;
          this.isBusy = false; 
          this.hudText = document.getElementById('hud-text')

          const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const wsUrl = `${protocol}//${window.location.host}/ws`;
          
          console.log("Connecting to", wsUrl);
          this.ws = new WebSocket(wsUrl);
          
          this.ws.onopen = () => {
            console.log("WebSocket Connected");
            this.connected = true;
          };

          this.ws.onmessage = (event) => {
            const blob = event.data;
            const url = URL.createObjectURL(blob);
            
            const img = new Image();
            img.onload = () => {
                const planes = document.querySelectorAll('.video-plane');
                planes.forEach(plane => {
                    const mesh = plane.getObject3D('mesh');
                    if (mesh && mesh.material && mesh.material.map) {
                       mesh.material.map.image = img;
                       mesh.material.map.needsUpdate = true;
                    }
                });
                URL.revokeObjectURL(url);
                this.isBusy = false; 
            };
            img.src = url;
          };

          this.ws.onclose = () => { this.connected = false; };
        },

        tick: function () {
          if (!this.connected || this.isBusy) return;

          // invert yaw to get left->rewind, right->forward
          const rotY = -this.camera.object3D.rotation.y;
          
          const PI2 = Math.PI * 2;
          let normalizedRot = rotY % PI2;
          
          if (normalizedRot < 0) normalizedRot += PI2;
          const pct = normalizedRot / PI2;

          if (this.hudText) {
            const degrees = (normalizedRot * (180 / Math.PI)).toFixed(1);
            this.hudText.setAttribute('value', `Yaw: ${degrees} | ${Math.round(pct * 100)}%`);
          }

          // if (pct < 0.05) {
          //   pct = 0;
          // }

          this.ws.send(pct.toString());
          this.isBusy = true; 
        }
      });

      AFRAME.registerComponent('stereo-layer', {
        schema: { eye: {type: 'string', default: 'left'} },
        init: function () {
          const layerMask = this.data.eye === 'left' ? 1 : 2;
          this.el.object3D.traverse((node) => {
            if (node.isMesh) node.layers.set(layerMask);
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #111">
      
      <a-assets>
        <img id="placeholder" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=">
      </a-assets>

      <a-entity position="0 1.6 0">
        <a-camera socket-scrub stereocam="eye: left;">

          <a-text id="hud-text" 
                    value="Yaw: 0 | 0%" 
                    position="0 1 -2" 
                    color="#00FF00" 
                    width="4">
          </a-text>
          
          <a-entity class="video-plane"
                    geometry="primitive: plane; width: 4; height: 2.25" 
                    position="0 0 -3"
                    material="shader: flat; src: #placeholder; repeat: 0.5 1; offset: 0 0"
                    stereo-layer="eye: left">
          </a-entity>

          <a-entity class="video-plane"
                    geometry="primitive: plane; width: 4; height: 2.25" 
                    position="0 0 -3"
                    material="shader: flat; src: #placeholder; repeat: 0.5 1; offset: 0.5 0"
                    stereo-layer="eye: right">
          </a-entity>

        </a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
